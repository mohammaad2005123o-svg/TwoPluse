
name: Build TwoPluse APK

on:
push:
branches: [ "*" ]
workflow_dispatch:

jobs:
build-apk:
name: Compile Android Debug APK
runs-on: ubuntu-latest

steps:  
  - name: Checkout Repository  
    uses: actions/checkout@v4  

  - name: Unpack Project ZIP Automatically  
    run: |  
      ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)  
      if [ -n "$ZIP_FILE" ]; then  
        unzip -o "$ZIP_FILE" -d .  
      fi  

  - name: Set up JDK 17  
    uses: actions/setup-java@v4  
    with:  
      distribution: 'temurin'  
      java-version: '17'  

  - name: Setup Gradle 8.9  
    uses: gradle/actions/setup-gradle@v4  
    with:  
      gradle-version: '8.9'  

  - name: Build Debug APK  
    run: gradle assembleDebug  

  - name: Rename APK to TwoPluse.apk  
    run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TwoPluse.apk  

  - name: Upload TwoPluse.apk Artifact  
    uses: actions/upload-artifact@v4  
    with:  
      name: TwoPluse-APK  
      path: app/build/outputs/apk/debug/TwoPluse.apk
